[package]
name    = "stateforge-tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "stateforge_tauri_lib"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stateforge-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sf-core    = { path = "../crates/sf-core" }
tauri      = { version = "2", features = ["macos-private-api"] }
tokio      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Ohne ein Plattform-Feature kompiliert keyring, speichert aber nichts:
# es faellt auf einen Speicher im Prozessspeicher zurueck, den ein zweiter
# Prozess nicht sieht. Zugangsdaten waren damit nach jedem Neustart weg,
# ohne dass ein Fehler gemeldet wurde.
keyring    = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-openssl", "tokio"] }
dirs       = "6"
sqlx       = { workspace = true }
chrono     = { workspace = true }
