[package]
name    = "sf-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde        = { workspace = true }
serde_json   = { workspace = true }
tokio        = { workspace = true }
anyhow       = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }
reqwest      = { workspace = true }
regex        = { workspace = true }
once_cell    = { workspace = true }

sqlx         = { workspace = true }
# Ohne ein Plattform-Feature kompiliert keyring, speichert aber nichts:
# es faellt auf einen Speicher im Prozessspeicher zurueck, den ein zweiter
# Prozess nicht sieht. Zugangsdaten waren damit nach jedem Neustart weg,
# ohne dass ein Fehler gemeldet wurde.
keyring      = { version = "3", features = ["apple-native", "windows-native", "async-secret-service", "crypto-openssl", "tokio"] }
async-trait  = "0.1"
dirs         = "6"

[dev-dependencies]
# Ohne Features deklariert, mit Absicht: Cargo vereinigt Features ueber den
# Graphen, und ein Feature hier wuerde den Backend auch dann aktivieren, wenn
# die echte Abhaengigkeit ihn verliert. Der Test wuerde dann seine eigene
# Konfiguration pruefen statt der der Anwendung.
keyring = "3"
